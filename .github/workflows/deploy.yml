name: Deploy to Netcup VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            echo "Navigating to app directory..."
            cd /var/www/newswebsite

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing clean dependencies..."
            rm -rf node_modules .next
            npm ci --include=optional
            npm install --no-save --package-lock=false lightningcss-linux-x64-gnu@1.32.0

            echo "Building Next.js application..."
            npm run build

            echo "Preparing standalone runtime assets..."
            mkdir -p .next/standalone/.next
            cp -R .next/static .next/standalone/.next/static
            if [ -d public ]; then
              cp -R public .next/standalone/public
            fi

            echo "Reloading PM2 process..."
            pm2 delete novexa-news 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save

            echo "Checking local application health..."
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                pm2 logs novexa-news --lines 100 --nostream
                exit 1
              fi
              sleep 5
            done

            echo "Deployment completed successfully."
            pm2 status
