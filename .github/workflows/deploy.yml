name: Deploy to Netcup VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            echo "Navigating to app directory..."
            cd /var/www/newswebsite

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing clean dependencies..."
            rm -rf node_modules .next
            npm ci --include=optional
            npm install --no-save --package-lock=false lightningcss-linux-x64-gnu@1.32.0

            echo "Building Next.js application..."
            npm run build

            echo "Reloading PM2 process..."
            pm2 reload novexa-news --update-env || pm2 start npm --name "novexa-news" -- start -- -p 3000
            pm2 save

            echo "Deployment completed successfully."
            pm2 status
